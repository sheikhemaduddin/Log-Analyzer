<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log Triage — Deploy & Build Log Analyzer</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <script>
    (function () {
      var t = localStorage.getItem('log-triage-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="top">
    <div class="brand"><span class="brand-mark">◈</span> Log Triage</div>
    <div class="top-actions">
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light mode" title="Switch to light mode">
        <span class="theme-icon theme-icon-sun" aria-hidden="true">☀</span>
        <span class="theme-icon theme-icon-moon" aria-hidden="true">☾</span>
      </button>
      <span class="status-item" id="st-runtime">runtime …</span>
    </div>
  </header>

  <main class="wrap">
    <div class="workspace">
      <div class="workspace-headers">
        <div class="panel-head">
          <label class="lbl" for="log-input">Deploy / build log</label>
          <p class="hint">Paste output from Cloudways, npm, Ansible, Docker, or CI.</p>
        </div>
        <div class="panel-head">
          <span class="lbl">Analysis</span>
          <p class="hint">Verdict, issues, Jira bug report, timeline, and error categories.</p>
        </div>
      </div>

      <div class="workspace-panes" id="workspace-panes">
        <div class="pane pane-input">
          <textarea id="log-input" class="mono-input" placeholder="Paste log output here…" spellcheck="false"></textarea>
        </div>
        <div class="pane pane-output">
          <div id="analyze-out" class="output">
            <div class="placeholder">Analysis will appear here.</div>
          </div>
        </div>
      </div>

      <div class="workspace-footers">
        <div class="pane-footer">
          <button id="analyze-btn" class="btn-primary">Analyze</button>
          <button id="analyze-clear" class="btn-ghost">Clear</button>
        </div>
        <div class="pane-footer pane-footer-spacer" aria-hidden="true"></div>
      </div>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
